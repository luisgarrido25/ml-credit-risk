name: ML CI Pipeline

on:
  push:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Validar que el modelo carga
        run: |
          python -c "import joblib; joblib.load('models/credit_model_v1.joblib')"

      - name: Build Docker
        run: |
          docker build -t credit-model-api .