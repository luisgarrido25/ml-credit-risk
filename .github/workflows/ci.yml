name: ML CI Pipeline

on:
  push:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Validar dependencias básicas
        run: |
          python -c "import flask; import sklearn; import pandas; print('Dependencias OK')"

      - name: Build Docker
        run: |
          docker build -t credit-model-api .

      - name: Autenticarse en GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Configurar Docker para Artifact Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build y push imagen
        run: |
          docker build -t us-central1-docker.pkg.dev/modelo-pruebas-cloud/credit-model-repo/credit-model-api:latest .
          docker push us-central1-docker.pkg.dev/modelo-pruebas-cloud/credit-model-repo/credit-model-api:latest